# Perfil de pruebas: H2 en memoria con dialecto PostgreSQL.
# Permite correr `./mvnw test` sin una instancia local de PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:shoppi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false

shoppi:
  jwt:
    # Secreto exclusivo para pruebas (>= 256 bits para HS256).
    secret: test-secret-shoppi-automatizado-0123456789abcdef0123456789abcdef
    expiration-minutes: 60
